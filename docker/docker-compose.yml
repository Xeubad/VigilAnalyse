version: '3.8'

services:
  vigil-analyse:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: vigil-analyse
    ports:
      - "3001:3001"
    volumes:
      - vigil-data:/app/data
    restart: always
    # 生产环境务必设置 AUTH_TOKEN，并在前端 .env.production 设置相同的 VITE_AUTH_TOKEN
    # environment:
    #   - AUTH_TOKEN=change-me-to-a-long-random-string

volumes:
  vigil-data:
